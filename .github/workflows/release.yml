name: release

# A tag is what the engine pins. Publishing one makes it available, never active:
# a deploy turns it on by changing the pinned tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run bundle -- "$GITHUB_REF_NAME"
      - run: >
          gh release create "$GITHUB_REF_NAME"
          dist/connectors-bundle.json dist/connectors-bundle.json.sha256
          --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
