# yaml-language-server: $schema=../schema/connector.schema.json
#
# Portal Nacional de Contratações Públicas, escrito a partir do OpenAPI público:
#   consulta:    https://pncp.gov.br/api/consulta/v3/api-docs  (listas por período)
#   manutenção:  https://pncp.gov.br/api/pncp/v3/api-docs      (itens de uma compra)
# Conferido em 09/11/2026. Sem autenticação. Comportamentos medidos naquele dia:
#   - janela sem dado responde 204 sem corpo (o runner lê como página vazia);
#   - o corpo traz `totalPaginas`, que encerra a leitura sem pedir uma página a mais;
#   - `/contratacoes/publicacao` recusa `tamanhoPagina` acima de 50 (HTTP 400);
#     `/contratos` e `/atas` aceitaram 500 no integrador anterior;
#   - na frente da API há um WAF que às vezes devolve uma página HTML com status 200.
id: pncp
title: PNCP — Contratações Públicas
publisher: Governo Federal (Ministério da Gestão)
kind: http-declarative
manifest:
  version: 1
  requester:
    urlTemplate: https://pncp.gov.br/api/consulta/v1/contratacoes/atualizacao
    params:
      pagina: '{{page}}'
      tamanhoPagina: '{{size}}'
  auth:
    type: none
  paginator:
    type: page
    param: pagina
    sizeParam: tamanhoPagina
    size: 50
    totalPagesPath: [totalPaginas]
    totalRecordsPath: [totalRegistros]
  # Não há cota publicada nem cabeçalho de limite: o PNCP só responde 429. Medido em 10/11/2026,
  # um pedido por vez: a 40 por minuto o 429 era constante; a 30 e a 20, nenhum em 100 pedidos.
  # 25 deixa folga, e o runner ainda desacelera sozinho se vier um 429.
  rateLimit:
    requestsPerMinute: 25
  # 5xx, 429 e a página do WAF repetem a MESMA página. Esgotadas as tentativas, a partição falha
  # e a próxima execução retoma dela: nunca um buraco silencioso.
  retry:
    attempts: 5
    baseDelayMs: 5000
    maxDelayMs: 120000
    blockedHtml: true
  limits:
    requestTimeoutMs: 90000
  streams:
    # Contratações ATUALIZADAS na semana, por modalidade (a API exige a modalidade). O filtro é
    # pela `dataAtualizacaoGlobal`: uma compra alterada depois de publicada volta a ser lida.
    - name: contratacoes
      params:
        dataInicial: '{{data_inicial}}'
        dataFinal: '{{data_final}}'
        codigoModalidadeContratacao: '{{modalidade}}'
      recordSelector: [data]
      missingIsEmpty: true

    # Contratos atualizados na semana.
    - name: contratos
      request:
        urlTemplate: https://pncp.gov.br/api/consulta/v1/contratos/atualizacao
      paginator:
        type: page
        param: pagina
        sizeParam: tamanhoPagina
        size: 500
        totalPagesPath: [totalPaginas]
        totalRecordsPath: [totalRegistros]
      params:
        dataInicial: '{{data_inicial}}'
        dataFinal: '{{data_final}}'
      recordSelector: [data]
      missingIsEmpty: true

    # Atas de registro de preço atualizadas na semana.
    - name: atas
      request:
        urlTemplate: https://pncp.gov.br/api/consulta/v1/atas/atualizacao
      paginator:
        type: page
        param: pagina
        sizeParam: tamanhoPagina
        size: 500
        totalPagesPath: [totalPaginas]
        totalRecordsPath: [totalRegistros]
      params:
        dataInicial: '{{data_inicial}}'
        dataFinal: '{{data_final}}'
      recordSelector: [data]
      missingIsEmpty: true

    # Editais com proposta aberta até a data final, por modalidade: o retrato de hoje.
    - name: editais_abertos
      request:
        urlTemplate: https://pncp.gov.br/api/consulta/v1/contratacoes/proposta
      params:
        dataFinal: '{{data_final}}'
        codigoModalidadeContratacao: '{{modalidade}}'
      recordSelector: [data]
      missingIsEmpty: true

    # Itens de cada compra. A API devolve a lista solta, sem envelope: termina na página vazia.
    - name: itens
      request:
        urlTemplate: https://pncp.gov.br/api/pncp/v1/orgaos/{{cnpj}}/compras/{{ano}}/{{sequencial}}/itens
      paginator:
        type: page
        param: pagina
        sizeParam: tamanhoPagina
        size: 50
      recordSelector: []
      partitionField: _partition
streams:
  # Incremental pela data de atualização. Na primeira carga, `since` é hoje menos dois anos; depois,
  # a última `dataAtualizacaoGlobal` já publicada. As janelas começam uma semana antes dela (folga
  # para atualização atrasada) e vão até a semana de hoje: depois da carga inicial, umas três
  # semanas por execução. A chave mantém só a versão mais recente de cada registro.
  - name: contratacoes
    syncMode: incremental
    primaryKey: [[numeroControlePNCP]]
    partitions:
      query: "SELECT formatDateTime(d, '%Y%m%d') AS data_inicial, formatDateTime(d + 6, '%Y%m%d') AS data_final, toString(m) AS modalidade FROM (SELECT toMonday(toDate('{{since}}') - 7) + toIntervalWeek(n) AS d FROM system.one ARRAY JOIN range(0, toUInt32(dateDiff('week', toMonday(toDate('{{since}}') - 7), today()) + 1)) AS n) ARRAY JOIN range(1, 14) AS m"
      since:
        query: "SELECT toString(toDate(max(parseDateTimeBestEffortOrNull(toString(dataAtualizacaoGlobal))))) FROM {{table:contratacoes}}"
        fallback: "SELECT toString(today() - toIntervalYear(2))"
  - name: contratos
    syncMode: incremental
    primaryKey: [[numeroControlePNCP]]
    partitions:
      query: "SELECT formatDateTime(d, '%Y%m%d') AS data_inicial, formatDateTime(d + 6, '%Y%m%d') AS data_final FROM (SELECT toMonday(toDate('{{since}}') - 7) + toIntervalWeek(n) AS d FROM system.one ARRAY JOIN range(0, toUInt32(dateDiff('week', toMonday(toDate('{{since}}') - 7), today()) + 1)) AS n)"
      since:
        query: "SELECT toString(toDate(max(parseDateTimeBestEffortOrNull(toString(dataAtualizacaoGlobal))))) FROM {{table:contratos}}"
        fallback: "SELECT toString(today() - toIntervalYear(2))"
  - name: atas
    syncMode: incremental
    primaryKey: [[numeroControlePNCPAta]]
    partitions:
      query: "SELECT formatDateTime(d, '%Y%m%d') AS data_inicial, formatDateTime(d + 6, '%Y%m%d') AS data_final FROM (SELECT toMonday(toDate('{{since}}') - 7) + toIntervalWeek(n) AS d FROM system.one ARRAY JOIN range(0, toUInt32(dateDiff('week', toMonday(toDate('{{since}}') - 7), today()) + 1)) AS n)"
      since:
        query: "SELECT toString(toDate(max(parseDateTimeBestEffortOrNull(toString(dataAtualizacaoGlobal))))) FROM {{table:atas}}"
        fallback: "SELECT toString(today() - toIntervalYear(2))"
  # O retrato de hoje: carga completa a cada execução.
  - name: editais_abertos
    syncMode: full_refresh
    primaryKey: [[numeroControlePNCP]]
    partitions:
      query: "SELECT formatDateTime(today() + 60, '%Y%m%d') AS data_final, toString(m) AS modalidade FROM system.one ARRAY JOIN range(1, 14) AS m"
  # Filho das contratações: as compras atualizadas no último ano, para caber no teto de 120 mil.
  - name: itens
    syncMode: full_refresh
    partitions:
      query: "SELECT DISTINCT JSONExtractString(orgaoEntidade, 'cnpj') AS cnpj, toString(anoCompra) AS ano, toString(sequencialCompra) AS sequencial FROM {{table:contratacoes}} WHERE parseDateTimeBestEffortOrNull(toString(dataAtualizacaoGlobal)) >= today() - 365 AND JSONExtractString(orgaoEntidade, 'cnpj') != ''"
