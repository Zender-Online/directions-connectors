    - name: account_performance_report
      request:
        headers:
          login-customer-id: "{{login_customer_id}}"
        body: '{"query":"SELECT customer.currency_code, customer.descriptive_name, customer.time_zone, metrics.active_view_cpm, metrics.active_view_ctr, metrics.active_view_impressions, metrics.active_view_measurability, metrics.active_view_measurable_cost_micros, metrics.active_view_measurable_impressions, metrics.active_view_viewability, segments.ad_network_type, metrics.all_conversions_from_interactions_rate, metrics.all_conversions_value, metrics.all_conversions, metrics.average_cost, metrics.average_cpc, metrics.average_cpe, metrics.average_cpm, metrics.trueview_average_cpv, customer.manager, metrics.clicks, metrics.content_budget_lost_impression_share, metrics.content_impression_share, metrics.content_rank_lost_impression_share, metrics.conversions_from_interactions_rate, metrics.conversions_value, metrics.conversions, metrics.cost_micros, metrics.cost_per_all_conversions, metrics.cost_per_conversion, metrics.cross_device_conversions, metrics.ctr, segments.date, segments.day_of_week, segments.device, metrics.engagement_rate, metrics.engagements, customer.id, metrics.impressions, metrics.interaction_rate, metrics.interaction_event_types, metrics.interactions, customer.auto_tagging_enabled, customer.test_account, segments.month, segments.quarter, metrics.search_budget_lost_impression_share, metrics.search_exact_match_impression_share, metrics.search_impression_share, metrics.search_rank_lost_impression_share, metrics.value_per_all_conversions, metrics.value_per_conversion, metrics.video_trueview_view_rate, metrics.video_trueview_views, metrics.view_through_conversions, segments.week, segments.year FROM customer WHERE segments.date DURING LAST_30_DAYS ORDER BY segments.date ASC","pageToken":"{{cursor}}"}'
      recordSelector: [results]
      missingIsEmpty: true
      partitionField: _partition
      ignoreErrors: *not_enabled

# Como cada stream é lido. Os filhos tiram as partições da tabela publicada do pai, desta
# mesma fonte: o pai precisa ter rodado e publicado antes.
streams:
  - name: accessible_customers
    syncMode: full_refresh

  - name: customer_client
    syncMode: full_refresh
    partitions:
      query: >-
        SELECT replaceOne(value, 'customers/', '') AS customer_id
        FROM {{table:accessible_customers}}
        WHERE customer_id != ''
        ORDER BY customer_id

  - name: customer
    syncMode: full_refresh
    partitions: &per_client
      # Uma conta cliente por linha, sem gerente (gerente não tem métrica), com a conta pela
      # qual foi alcançada. Alcançada por dois gerentes, vale o primeiro em ordem de texto, para
      # a escolha ser estável entre execuções.
      query: >-
        SELECT trim(BOTH '"' FROM JSONExtractRaw(customerClient, 'id')) AS customer_id,
          min(JSONExtractString(_partition, 'customer_id')) AS login_customer_id
        FROM {{table:customer_client}}
        WHERE customer_id != '' AND NOT JSONExtractBool(customerClient, 'manager')
        GROUP BY customer_id
        ORDER BY customer_id

  - name: campaign
    syncMode: full_refresh
    partitions: *per_client

  - name: ad_group
    syncMode: full_refresh
    partitions: *per_client

  - name: ad_group_ad
    syncMode: full_refresh
    partitions: *per_client

  - name: account_performance_report
    syncMode: full_refresh
    partitions: *per_client
