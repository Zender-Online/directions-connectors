        body: '{"dimensions":[{"name":"date"}],"metrics":[{"name":"active28DayUsers"}],"dateRanges":[{"startDate":"30daysAgo","endDate":"yesterday"}],"orderBys":[{"dimension":{"dimensionName":"date"}}],"keepEmptyRows":false,"limit":{{size}},"offset":{{offset}}}'
      recordSelector: [rows]
      missingIsEmpty: true
      partitionField: _partition

    - name: devices
      request:
        body: '{"dimensions":[{"name":"date"},{"name":"deviceCategory"},{"name":"operatingSystem"},{"name":"browser"}],"metrics":[{"name":"totalUsers"},{"name":"newUsers"},{"name":"sessions"},{"name":"sessionsPerUser"},{"name":"averageSessionDuration"},{"name":"screenPageViews"},{"name":"screenPageViewsPerSession"},{"name":"bounceRate"}],"dateRanges":[{"startDate":"30daysAgo","endDate":"yesterday"}],"orderBys":[{"dimension":{"dimensionName":"date"}},{"dimension":{"dimensionName":"deviceCategory"}},{"dimension":{"dimensionName":"operatingSystem"}},{"dimension":{"dimensionName":"browser"}}],"keepEmptyRows":false,"limit":{{size}},"offset":{{offset}}}'
