# yaml-language-server: $schema=../schema/connector.schema.json
#
# Traduzido de airbytehq/airbyte source-google-analytics-data-api 2.11.10, commit
# e8cdbb81b382fefdb662670e74342c073f7ccb4b. Elastic License 2.0: ver vendor/airbyte/LICENSE.
# MODIFICADO: o campo `origin.modifications` abaixo diz o quê.
id: google-analytics-4
title: Google Analytics 4 (relatórios padrão)
publisher: Google
kind: http-declarative
origin:
  project: airbytehq/airbyte
  connector: source-google-analytics-data-api
  version: 2.11.10
  commit: e8cdbb81b382fefdb662670e74342c073f7ccb4b
  license: Elastic-2.0
  modifications: >-
    Reescrito no formato http-declarative do Directions, só com os 57 relatórios padrão e
    autenticação OAuth2 com refresh token (sem conta de serviço, sem relatórios próprios, sem
    pivô nem coorte). As propriedades não vêm da configuração: saem da lista de propriedades que a
    credencial enxerga (accountSummaries), e cada relatório é uma partição por propriedade. A
    janela é fixa, dos últimos 30 dias até ontem, em vez do cursor incremental de 365 dias. As
    linhas ficam como a API devolve (dimensionValues e metricValues na ordem do pedido, com a
    propriedade em _partition); juntar nome e valor, o que o CombinedExtractor faz em Python, fica
    para o SQL no ClickHouse, sobre o RAW.
manifest:
  version: 1
  requester:
    urlTemplate: https://analyticsdata.googleapis.com/v1beta/properties/{{property_id}}:runReport
    method: POST
    headers:
      content-type: application/json
  auth:
    type: oauth2
    tokenUrl: https://oauth2.googleapis.com/token
    clientIdRef: client_id
    clientSecretRef: client_secret
    refreshTokenRef: refresh_token
  # Os relatórios paginam por offset dentro do corpo, de 25 mil linhas, como no Airbyte. O
  # rowCount diz quando parar, sem pedir uma página vazia no fim.
  paginator:
    type: offset
    param: offset
    sizeParam: limit
    size: 25000
    totalPath: [rowCount]
  rateLimit:
    requestsPerMinute: 60
  streams:
    # As contas e propriedades que a credencial enxerga. É o pai de todos os outros.
    - name: account_summaries
      request:
        urlTemplate: https://analyticsadmin.googleapis.com/v1beta/accountSummaries
        method: GET
      params:
        pageSize: "200"
        pageToken: "{{cursor}}"
      paginator:
        type: cursor
        param: pageToken
        cursorPath: [nextPageToken]
      recordSelector: [accountSummaries]
      missingIsEmpty: true

    # A propriedade: nome, fuso, moeda. O mesmo pedido do property_metadata do Airbyte.
    - name: property_metadata
      request:
        urlTemplate: https://analyticsadmin.googleapis.com/v1beta/properties/{{property_id}}
        method: GET
      paginator:
        type: none
      singleRecord: true

    # Os 57 relatórios padrão do Airbyte: dimensões e métricas iguais, ordenados por todas as
    # dimensões para que o offset seja estável entre páginas.
    - name: daily_active_users
      request:
        body: '{"dimensions":[{"name":"date"}],"metrics":[{"name":"active1DayUsers"}],"dateRanges":[{"startDate":"30daysAgo","endDate":"yesterday"}],"orderBys":[{"dimension":{"dimensionName":"date"}}],"keepEmptyRows":false,"limit":{{size}},"offset":{{offset}}}'
      recordSelector: [rows]
      missingIsEmpty: true
      partitionField: _partition

    - name: weekly_active_users
      request:
        body: '{"dimensions":[{"name":"date"}],"metrics":[{"name":"active7DayUsers"}],"dateRanges":[{"startDate":"30daysAgo","endDate":"yesterday"}],"orderBys":[{"dimension":{"dimensionName":"date"}}],"keepEmptyRows":false,"limit":{{size}},"offset":{{offset}}}'
      recordSelector: [rows]
      missingIsEmpty: true
      partitionField: _partition

    - name: four_weekly_active_users
