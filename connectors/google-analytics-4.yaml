# Como cada stream é lido. Os filhos tiram as propriedades da tabela publicada do pai, desta
# mesma fonte: o pai precisa ter rodado e publicado antes.
streams:
  - name: account_summaries
    syncMode: full_refresh
    primaryKey: [[account]]

  - name: property_metadata
    syncMode: full_refresh
    primaryKey: [[name]]
    partitions: &per_property
      query: >-
        SELECT DISTINCT
          replaceOne(JSONExtractString(summary, 'property'), 'properties/', '') AS property_id
        FROM {{table:account_summaries}}
        ARRAY JOIN JSONExtractArrayRaw(propertySummaries) AS summary
        WHERE property_id != ''
        ORDER BY property_id

  - name: daily_active_users
    syncMode: full_refresh
    partitions: *per_property

  - name: weekly_active_users
    syncMode: full_refresh
    partitions: *per_property

