- id: anvisa-medicamentos
  title: Medicamentos registrados
  publisher: Anvisa
  terms:
  - medicamento
  - medicamentos
  - remedio
  - anvisa
  - registro
  - farmaco
  endpoint: https://dados.anvisa.gov.br/dados/DADOS_ABERTOS_MEDICAMENTOS.csv
  format: csv
  recordSelector: []
  checkedAt: '2026-10-23'
  measurement: HTTP 200 com 44,8 MB em 8,9 s
  note: '44,8 MB: NÃO cabe na sondagem (teto de 2 MB), e por isso ela reporta falha. O runner lê — o teto
    da receita é 2 GB. É o caso em que a amostra não se mostra antes de aprovar.'
- id: inpe-desmatamento
